<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>ZenTask — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="design-system/colors_and_type.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #root { height: 100%; }
    button { font-family: inherit; }
    a { color: inherit; }

    /* Hover polish from the kit */
    .zt-btn-primary:hover   { background: var(--btn-primary-bg-hover) !important; }
    .zt-btn-secondary:hover { background: var(--bg-hover) !important; border-color: var(--border-strong) !important; }
    .zt-btn-ghost:hover     { background: var(--bg-hover) !important; }
    .zt-btn-soft:hover      { filter: brightness(0.96); }
    .zt-iconbtn:hover       { background: var(--bg-hover); color: var(--fg) !important; }
    .zt-nav:hover           { background: var(--bg-hover); }
    .zt-card:hover          { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .zt-row:hover           { background: var(--bg-hover); border-radius: 8px; }
    .zt-chip:hover          { background: var(--bg-hover); }
    .zt-link {
      color: var(--fg-muted); font-size: 12px; font-weight: 600;
      text-decoration: none; letter-spacing: -0.005em;
    }
    .zt-link:hover { color: var(--accent); }

    /* Scrollbar polish */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: padding-box; border: 2px solid transparent; }

    @keyframes zt-fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/Sidebar.jsx"></script>
  <script type="text/babel" src="src/Board.jsx"></script>
  <script type="text/babel" src="src/TaskDetail.jsx"></script>
  <script type="text/babel" src="src/Dashboard.jsx"></script>
  <script type="text/babel" src="src/NewTaskModal.jsx"></script>
  <script type="text/babel" src="src/Stubs.jsx"></script>
  <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
